<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Shift Scheduler</title>
	<style>
		body {
			align-items: center;
			background: #f4f6f8;
			display: flex;
			font-family: Arial, sans-serif;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
		}

		.login-card {
			background: #ffffff;
			border-radius: 10px;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
			padding: 2.5rem;
			text-align: center;
			width: min(90%, 400px);
		}

		h1 {
			color: #1f2937;
			margin: 0 0 1.5rem;
		}

		.role-buttons {
			display: flex;
			gap: 1rem;
			justify-content: center;
		}

		button {
			background: #2563eb;
			border: 0;
			border-radius: 6px;
			color: white;
			cursor: pointer;
			font-size: 1rem;
			padding: 0.75rem 1.5rem;
		}

		button:hover {
			background: #1d4ed8;
		}
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Shift Scheduler</h1>
		<div class="role-buttons">
            <form action="/student" method="post">
                <button type="submit">Student</button>
            </form>
            <form action="/admin" method="post">
                <button type="submit">Admin</button>
            </form>
		</div>
	</main>
</body>
</html>
