<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Approval</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 16px;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .status-pill {
            background: #e0f2fe;
            color: #075985;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .request-list {
            display: grid;
            gap: 16px;
        }

        .request-card {
            background: #fff;
            border: 1px solid #dfe6ee;
            border-radius: 10px;
            padding: 20px;
        }

        .request-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .student-name {
            margin: 0;
            font-size: 1.3rem;
        }

        .pending {
            color: #92400e;
            background: #fef3c7;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            margin-bottom: 20px;
            color: #475569;
            font-size: 0.95rem;
        }

        .schedule-summary {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .action-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .approve {
            background: #16a34a;
            color: white;
        }

        .deny {
            background: #dc2626;
            color: white;
        }

        .secondary {
            background: #e2e8f0;
            color: #0f172a;
        }

        textarea {
            width: 100%;
            min-height: 70px;
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            resize: vertical;
            font: inherit;
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="header">
            <h1>Shift Approval</h1>
            <span class="status-pill">3 pending reviews</span>
        </div>

        <section class="request-list">
            <article class="request-card">
                <div class="request-top">
                    <h2 class="student-name">Alex Morgan</h2>
                    <span class="pending">Pending</span>
                </div>

                <div class="meta">
                    <span>Submitted: May 15, 2026</span>
                    <span>Requested hours: 18</span>
                    <span>Availability: 2 days</span>
                </div>

                <div class="schedule-summary">
                    Monday: 8:00 AM - 12:00 PM<br>
                    Wednesday: 1:00 PM - 5:00 PM
                </div>

                <div class="action-row">
                    <button class="btn approve" type="button">Approve</button>
                    <button class="btn deny" type="button">Deny</button>
                    <button class="btn secondary" type="button">View full schedule</button>
                </div>

                <textarea placeholder="Add a note for the student if denied..."></textarea>
            </article>
        </section>
    </main>
</body>
</html>
